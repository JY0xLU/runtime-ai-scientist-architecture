<svg xmlns="http://www.w3.org/2000/svg" width="900" height="710" viewBox="0 0 900 710" role="img" aria-labelledby="title description">
  <title id="title">Runtime AI Scientist: execution architecture</title>
  <desc id="description">Public task inputs and run configuration enter either the N0 host-native lifecycle or the R1–R3 RAC runtime. Both paths use a HostBridge for one of three equally weighted alternatives: ARK, Agent Laboratory, or EvoScientist. Persisted artifacts are evaluated separately by the benchmark scorer. Hidden targets are excluded from the host workspace.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#42607d"/></marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #132b45; }
      .heading { font-size: 25px; font-weight: 700; }
      .label { font-size: 22px; font-weight: 600; }
      .body { font-size: 18px; fill: #405b74; }
      .small { font-size: 18px; fill: #405b74; }
      .flow { fill: none; stroke: #42607d; stroke-width: 2; marker-end: url(#arrow); }
      .panel { stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="900" height="710" rx="18" fill="#ffffff"/>
  <text x="24" y="37" class="heading">Execution architecture</text>
  <text x="876" y="35" text-anchor="end" class="small">One host per episode</text>

  <rect x="24" y="75" width="252" height="94" rx="12" fill="#f0f5fa" stroke="#bbcddd" class="panel"/>
  <text x="150" y="111" text-anchor="middle" class="label">Task + run setup</text>
  <text x="150" y="143" text-anchor="middle" class="small">Public inputs · seed · budget</text>

  <path d="M276 122H338" class="flow"/>
  <path d="M150 169V228" class="flow"/>
  <rect x="24" y="230" width="252" height="86" rx="12" fill="#f6f7fa" stroke="#b5c1cf" class="panel"/>
  <text x="150" y="264" text-anchor="middle" class="label">N0 · Native lifecycle</text>
  <text x="150" y="295" text-anchor="middle" class="small">Host-owned scheduling</text>

  <rect x="340" y="75" width="536" height="241" rx="12" fill="#edf6fc" stroke="#71a7ce" class="panel"/>
  <text x="366" y="111" class="label">R1–R3 · Shared RAC runtime</text>
  <line x1="366" y1="131" x2="850" y2="131" stroke="#c1d9eb"/>
  <text x="366" y="164" class="body"><tspan font-weight="700">R1</tspan><tspan dx="16">Communication + native successor</tspan></text>
  <text x="366" y="204" class="body"><tspan font-weight="700">R2</tspan><tspan dx="16">+ Rule-based capability selection</tspan></text>
  <text x="366" y="244" class="body"><tspan font-weight="700">R3</tspan><tspan dx="16">+ Contracts + advisory verification</tspan></text>
  <text x="366" y="287" class="small">Checkpoint → select → invoke → feedback</text>

  <path d="M150 316V366" class="flow"/>
  <path d="M608 316V366" class="flow"/>
  <rect x="24" y="368" width="852" height="78" rx="12" fill="#f0f7f5" stroke="#90b9af" class="panel"/>
  <text x="450" y="400" text-anchor="middle" class="label">HostBridge · one adapter per episode</text>
  <text x="450" y="429" text-anchor="middle" class="body">Normalized state · capabilities · artifacts</text>

  <path d="M154 446V484" class="flow"/>
  <path d="M450 446V484" class="flow"/>
  <path d="M746 446V484" class="flow"/>
  <g fill="#f0f7f5" stroke="#90b9af" class="panel">
    <rect x="24" y="486" width="260" height="78" rx="12"/>
    <rect x="320" y="486" width="260" height="78" rx="12"/>
    <rect x="616" y="486" width="260" height="78" rx="12"/>
  </g>
  <text x="154" y="519" text-anchor="middle" class="label">ARK</text>
  <text x="450" y="519" text-anchor="middle" class="label">Agent Laboratory</text>
  <text x="746" y="519" text-anchor="middle" class="label">EvoScientist</text>
  <text x="154" y="548" text-anchor="middle" class="small">Native roles + tools</text>
  <text x="450" y="548" text-anchor="middle" class="small">Native roles + tools</text>
  <text x="746" y="548" text-anchor="middle" class="small">Native roles + tools</text>

  <path d="M154 564V608" class="flow"/>
  <path d="M450 564V608" class="flow"/>
  <path d="M746 564V608" class="flow"/>
  <rect x="24" y="610" width="852" height="80" rx="12" fill="#fbf6e9" stroke="#d6bb77" class="panel"/>
  <text x="450" y="643" text-anchor="middle" class="label">Persisted artifacts → independent benchmark scoring</text>
  <text x="450" y="673" text-anchor="middle" class="small">Hidden scoring targets are excluded from the host workspace.</text>
</svg>
